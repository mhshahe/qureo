  .row .val { color:#fff; font-weight:700; text-align:left; direction:ltr; word-break:break-all; }

/* ================= منطق البحث ================= */
const codeInput = document.getElementById('codeInput');
const resultBox = document.getElementById('resultBox');
const errorBox  = document.getElementById('errorBox');

function searchStudent(){
  const code = codeInput.value.trim();
  resultBox.classList.remove('show');
  errorBox.classList.remove('show');

  if(!code){
    showError('⚠️ من فضلك أدخل كود الطالب أولاً');
    return;
  }

  const student = students.find(s => s.code === code);

  if(!student){
    showError('❌ الكود غير موجود، تأكد من كتابة الكود بشكل صحيح');
    return;
  }

  if(!student.user || !student.pass){
    showError('⚠️ بياناتك غير مكتملة على المنصة، يرجى مراجعة إدارة المدرسة');
    return;
  }

  document.getElementById('rName').textContent = student.name;
  document.getElementById('rUser').textContent = student.user;
  document.getElementById('rPass').textContent = student.pass;
  resultBox.classList.add('show');
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

function copyText(id){
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = '✓ تم';
    setTimeout(()=> btn.textContent = old, 1200);
  });
}

codeInput.addEventListener('keypress', e => {
  if(e.key === 'Enter') searchStudent();
});
</script>
